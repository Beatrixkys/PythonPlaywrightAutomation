
name: Playwright Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
      inputs:
        TEST_ENV:
          description: 'Test environment (e.g., tst, dev, prod)'
          required: false
          default: 'tst'
        BROWSERS:
          description: 'Comma-separated list of browsers to test (e.g., chromium, firefox, webkit)'
          required: false
          default: 'chromium'
        RETRIES:
          description: 'Number of retries for failed tests'
          required: false
          default: '1'
        RETRY_DELAY:
          description: 'Delay between retries in seconds'
          required: false
          default: '1'
        TEST_SUITES:
          description: Test Suite
          type: choice
          required: true
          default: all
          options:
            - loan_calc
            - all
        ZAP_SCAN:
          description: 'Run OWASP ZAP scan (true/false)'
          required: false
          default: 'true'


jobs:
  automated-tests:
    runs-on: ubuntu-latest
    env:
      TEST_ENV: ${{ inputs.TEST_ENV || 'tst' }}
      BROWSERS: ${{ inputs.BROWSERS || 'chromium' }}
      TEST_SUITES: ${{ inputs.TEST_SUITES || 'all' }}
      RETRIES: ${{ inputs.RETRIES || '1' }}
      RETRY_DELAY: ${{ inputs.RETRY_DELAY || '1' }}
      ZAP_SCAN: ${{ inputs.ZAP_SCAN || 'false' }}
      BASE_URL: https://applynow.cimb.com.my/eform-app/loans/calculator?action=calc
      BASE_API_PLACEHOLDER: https://jsonplaceholder.typicode.com


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps $BROWSERS

      - name: Run tests
        run: |
          if [ "$TEST_SUITES" = "all" ]; then
            python -m pytest
          else
            python -m pytest -m "$TEST_SUITES"
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
      
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-report
          path: reports/
          retention-days: 14
      
      - name: Prepare ZAP report directory
        run: |
          mkdir -p reports/zap
          chmod -R 777 reports/zap

      - name: Run OWASP ZAP Baseline Scan
        if: always()
        run: |
          if [ -z "$BASE_API_PLACEHOLDER" ]; then
            echo "BASE_API_PLACEHOLDER is not configured"
            exit 1
          fi

          mkdir -p reports/zap

          docker run --rm \
            -v "$GITHUB_WORKSPACE/reports/zap:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "$BASE_API_PLACEHOLDER" \
            -r zap-report.html

      # Upload all test and security reports
      - name: Upload test and security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-and-security-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14