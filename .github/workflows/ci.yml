
name: Playwright Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
      inputs:
        TEST_ENV:
          description: 'Test environment (e.g., tst, dev, prod)'
          required: false
          default: 'tst'
        BROWSERS:
          description: 'Comma-separated list of browsers to test (e.g., chromium, firefox, webkit)'
          required: false
          default: 'chromium'
        RETRIES:
          description: 'Number of retries for failed tests'
          required: false
          default: '1'
        RETRY_DELAY:
          description: 'Delay between retries in seconds'
          required: false
          default: '1'
        test_suite:
          description: Test Suite
          type: choice
          required: true
          default: all
          options:
            - loan_calc
            - all


jobs:
  automated-tests:
    runs-on: ubuntu-latest
    env:
      TEST_ENV: ${{ inputs.test_env || 'tst' }}
      BROWSERS: ${{ inputs.browsers || 'chromium' }}
      TEST_SUITE: ${{ inputs.test_suite || 'smoke' }}
      RETRIES: ${{ inputs.retries || '1' }}
      RETRY_DELAY: ${{ inputs.retry_delay || '1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps $BROWSERS

      - name: Run tests
        run: |
          if [ "$TEST_SUITE" = "all" ]; then
            python -m pytest
          else
            python -m pytest -m "$TEST_SUITE"
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: reports/
          if-no-files-found: ignore